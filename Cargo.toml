[package]
name = "edge-tts-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A lightweight macOS desktop client for Microsoft Edge Read Aloud TTS"

[dependencies]
directories = "6.0"
edge-tts-rust = "0.1.3"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
proxy_cfg = "0.4.2"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["fs", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Used by `cargo bundle --release` on macOS (cargo-bundle is optional tooling).
[package.metadata.bundle]
name = "Edge TTS Studio"
identifier = "com.auralabs.edgettsstudio"
category = "public.app-category.utilities"
short_description = "Generate MP3 speech with Microsoft Edge voices"
osx_minimum_system_version = "12.0"
icon = ["assets/AppIcon.icns"]
