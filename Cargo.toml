[package]
name = "edge-tts-studio"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A cross-platform Edge/Qwen3 TTS and local Whisper subtitle studio"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
directories = "6.0"
edge-tts-rust = "0.1.3"
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow"] }
encoding_rs = "0.8.35"
futures-util = "0.3"
proxy_cfg = "0.4.2"
rfd = "0.17.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rodio = { version = "0.20.1", default-features = false }
rusty_mp3 = "0.7.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.4", features = ["all"] }
tokio = { version = "1.45", features = ["fs", "rt-multi-thread", "sync", "time"] }
url = "2.5"

[target.'cfg(target_os = "macos")'.dependencies]
# Use Apple GPU acceleration for local Whisper transcription on macOS.
rwhisper = { version = "0.4.1", features = ["metal"] }
# Qwen3-TTS runs fully locally through Candle and uses Apple Metal on macOS.
speakers-qwen3-tts = { version = "0.3.0", default-features = false, features = ["metal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# Candle's portable CPU backend keeps the same local transcription feature on
# Windows and Linux without trying to compile Apple's Metal framework.
rwhisper = { version = "0.4.1" }
# Keep the same local Qwen3-TTS feature on non-Apple platforms using CPU.
speakers-qwen3-tts = { version = "0.3.0", default-features = false, features = ["cpu"] }

[patch.crates-io]
# Keep the upstream API, with a small bounds-safe DTW timestamp fix for long
# multilingual recordings. See vendor/rwhisper/PATCHES.md.
rwhisper = { path = "vendor/rwhisper" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Used by `cargo bundle --release` on macOS (cargo-bundle is optional tooling).
[package.metadata.bundle]
name = "Edge TTS Studio"
identifier = "com.auralabs.edgettsstudio"
category = "public.app-category.utilities"
short_description = "Generate MP3 speech and local AI subtitles"
osx_minimum_system_version = "12.0"
icon = ["assets/AppIcon.icns", "assets/AppIcon.svg"]
resources = [
    "LICENSE.md",
    "LICENSE.zh-CN.md",
    "COMMERCIAL_LICENSE.md",
    "SERVICE_AND_VOICE_NOTICE.md",
]
